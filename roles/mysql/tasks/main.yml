- name: Setup MySQL Root Password
  ansible.builtin.shell: mysql -uroot -p'RoboShop@1' -e "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'RoboShop@1'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
